="17">across all 7 OSI layers.</text><text x="22" y="187" class="y" font-size="15">REACT · TYPESCRIPT · ZUSTAND · VITEST</text></g><g transform="translate(28 568)"><rect width="544" height="220" rx="13" fill="none" class="line" stroke-opacity=".38" stroke-width="2"/><text x="22" y="36" class="g" font-size="16">03 / PRIVACY-FIRST TOOLKIT</text><text x="22" y="76" class="fg" font-size="22" font-weight="700">Utility Forge</text><text x="22" y="115" class="m" font-size="17">Six standalone, locally processed tools</text><text x="22" y="145" class="m" font-size="17">for files and documents.</text><text x="22" y="187" class="y" font-size="15">HTML · JAVASCRIPT · PHP · SECURE DESIGN</text></g><g transform="translate(28 810)"><rect width="544" height="220" rx="13" fill="none" class="line" stroke-opacity=".38" stroke-width="2"/><text x="22" y="36" class="g" font-size="16">04 / LINUX AUTOMATION</text><text x="22" y="76" class="fg" font-size="22" font-weight="700">RFNM SDR++ Setup</text><text x="22" y="115" class="m" font-size="17">Automated SDR++ build and install</text><text x="22" y="145" class="m" font-size="17">with RFNM and SoapySDR support.</text><text x="22" y="187" class="y" font-size="15">BASH · LINUX · CMAKE · SOAPYSDR</text></g></g></svg>