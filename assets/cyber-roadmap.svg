<circle cx="735" cy="124" r="11" fill="#0a1710" stroke="#43ff91" stroke-width="3"><animate attributeName="r" values="10;14;10" dur="2.2s" repeatCount="indefinite"/></circle><text x="735" y="92" fill="#f1fff5" font-size="16" font-weight="700">SPECIALISING</text><text x="735" y="158" fill="#b9d7c2" font-size="14">Web Security · Pentest</text>
