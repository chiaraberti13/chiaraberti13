<circle cx="115" cy="124" r="11" fill="#43ff91"/><text x="115" y="92" fill="#f1fff5" font-size="16" font-weight="700">FOUNDATIONS</text><text x="115" y="158" fill="#b9d7c2" font-size="14">Web Dev · Linux</text>
