<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Cybersecurity roadmap"><style>:root{--fg:#f1fff5;--muted:#83b792;--blue:#43ff91;--line:#43ff91}@media(prefers-color-scheme:light){:root{--fg:#174d2a;--muted:#1a7f37;--blue:#1a7f37;--line:#1a7f37}}.fg{fill:var(--fg)}.m{fill:var(--muted)}.b{fill:var(--blue)}.line{stroke:var(--line);stroke-opacity:.55}.bl{stroke:var(--blue)}</style><rect x="1.5" y="1.5" width="1197" height="237" rx="16" fill="none" class="line" stroke-width="3"/><g font-family="'Courier New',monospace"><text x="36" y="46" class="b" font-size="18">$ roadmap --active</text><path d="M92 124H1108" class="line" stroke-width="5"/><path d="M92 124H605" class="bl" stroke-width="5"/><g text-anchor="middle"><circle cx="115" cy="124" r="11" class="b"/><text x="115" y="92" class="fg" font-size="16" font-weight="700">FOUNDATIONS</text><text x="115" y="158" class="m" font-size="14">Web Dev · Linux</text><circle cx="425" cy="124" r="11" class="b"/><text x="425" y="92" class="fg" font-size="16" font-weight="700">CERTIFIED</text><text x="425" y="158" class="m" font-size="14">Security+ SY0-701</text><circle cx="735" cy="124" r="11" fill="none" class="bl" stroke-width="3"><animate attributeName="r" values="10;14;10" dur="2.2s" repeatCount="indefinite"/></circle><text x="735" y="92" class="fg" font-size="16" font-weight="700">SPECIALISING</text><text x="735" y="158" class="m" font-size="14">Web Security · Pentest</text><circle cx="1045" cy="124" r="11" fill="none" class="line" stroke-width="3"/><text x="1045" y="92" class="fg" font-size="16" font-weight="700">DIRECTION</text><text x="1045" y="158" class="m" font-size="14">Penetration Test · Red Team</text></g><text x="36" y="205" class="m" font-size="13">PROGRESS  [████████████░░░░░░░░]  BUILD IN PROGRESS</text></g></svg>