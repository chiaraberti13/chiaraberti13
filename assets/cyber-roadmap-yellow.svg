<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Terminal-style roadmap from web development and automation through Security+ to CCNA, eJPT, penetration testing and Red Teaming"><style>:root{--fg:#f1fff5;--muted:#83b792;--green:#43ff91;--line:#43ff91;--ochre:#d0a236}@media(prefers-color-scheme:light){:root{--fg:#174d2a;--muted:#1a7f37;--green:#1a7f37;--line:#1a7f37;--ochre:#946b16}}@media(prefers-reduced-motion:reduce){animate{display:none}}.fg{fill:var(--fg)}.m{fill:var(--muted)}.g{fill:var(--green)}.line{stroke:var(--line)}.gl{stroke:var(--green)}.y{fill:var(--ochre)}</style><rect x="1.5" y="1.5" width="1197" height="297" rx="16" fill="none" class="line" stroke-opacity=".38" stroke-width="2"/><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="36" y="52" font-size="22"><tspan class="y">$</tspan><tspan dx="12" class="g">roadmap --status</tspan></text><path d="M115 154H1045" class="gl" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="3 9"/><g text-anchor="middle"><g><text x="115" y="101" class="g" font-size="15">[OK]</text><text x="115" y="130" class="fg" font-size="18" font-weight="700">FOUNDATIONS</text><circle cx="115" cy="154" r="5" fill="#061009" class="gl" stroke-width="2"/><text x="115" y="191" class="m" font-size="16">Web Dev · Automation</text></g><g><text x="425" y="101" class="g" font-size="15">[OK]</text><text x="425" y="130" class="fg" font-size="18" font-weight="700">CERTIFIED</text><circle cx="425" cy="154" r="5" fill="#061009" class="gl" stroke-width="2"/><text x="425" y="191" class="m" font-size="16">Linux Essentials · Security+</text></g><g><text x="735" y="101" class="y" font-size="15">[RUN]</text><text x="735" y="130" class="fg" font-size="18" font-weight="700">IN PROGRESS</text><circle cx="735" cy="154" r="5" class="y"><animate attributeName="opacity" values=".48;1;.48" dur="2.8s" repeatCount="indefinite"/></circle><text x="735" y="191" class="m" font-size="16">CCNA 200-301 · eJPT</text></g><g><text x="1045" y="101" class="m" font-size="15">[..]</text><text x="1045" y="130" class="fg" font-size="18" font-weight="700">GOAL</text><circle cx="1045" cy="154" r="5" fill="none" class="line" stroke-opacity=".38" stroke-width="2"/><text x="1045" y="191" class="m" font-size="16">Penetration Tester · Red Team</text></g></g><path d="M36 220H1164" class="line" stroke-opacity=".18"/><text x="36" y="261" font-size="16"><tspan class="y">&gt;</tspan><tspan dx="11" class="g">current_focus --ccna --ejpt --hands-on-labs</tspan><tspan class="y">_</tspan><animate attributeName="opacity" values="1;1;.45;1" dur="2.4s" repeatCount="indefinite"/></text></g></svg>