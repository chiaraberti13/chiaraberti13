<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Cybersecurity roadmap">
<style>:root{--fg:#f1fff5;--muted:#83b792;--blue:#43ff91;--line:#43ff91;--ochre:#d0a236;--pale-ochre:#f1dda0}@media(prefers-color-scheme:light){:root{--fg:#174d2a;--muted:#1a7f37;--blue:#1a7f37;--line:#1a7f37;--ochre:#9a7018;--pale-ochre:#ead792}}.fg{fill:var(--fg)}.m{fill:var(--muted)}.b{fill:var(--blue)}.line{stroke:var(--line)}.y{fill:var(--ochre)}.yl{stroke:var(--ochre)}.active{fill:var(--pale-ochre);stroke:var(--ochre)}.green{fill:var(--blue);stroke:var(--blue)}</style>
<defs><filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="1.5" y="1.5" width="1197" height="267" rx="16" fill="none" class="line" stroke-opacity=".55" stroke-width="3"/>
<g font-family="'Courier New',monospace">
<text x="36" y="46" font-size="18"><tspan class="y">$</tspan><tspan class="b"> roadmap --active</tspan></text>
<g stroke-linecap="round">
<path d="M115 137H1045" class="line" stroke-opacity=".18" stroke-width="12"/>
<path d="M115 137H735" class="line" stroke-opacity=".8" stroke-width="5"/>
<path d="M115 137H735" class="line" stroke-opacity=".45" stroke-width="2" stroke-dasharray="4 11"/>
</g>
<circle r="5" class="b" filter="url(#softGlow)">
<animateMotion path="M115 137 H735" dur="5.2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="5.2s" repeatCount="indefinite"/>
</circle>
<g text-anchor="middle">
<g><circle cx="115" cy="137" r="17" fill="none" class="yl" stroke-opacity=".28" stroke-width="2"/><circle cx="115" cy="137" r="10" class="y"/><text x="115" y="98" class="fg" font-size="16" font-weight="700">FOUNDATIONS</text><text x="115" y="178" class="m" font-size="14">Web Dev · Linux</text></g>
<g><circle cx="425" cy="137" r="17" fill="none" class="yl" stroke-opacity=".28" stroke-width="2"/><circle cx="425" cy="137" r="10" class="y"/><text x="425" y="98" class="fg" font-size="16" font-weight="700">CERTIFIED</text><text x="425" y="178" class="m" font-size="14">Security+ SY0-701</text></g>
<g><circle cx="735" cy="137" r="16" class="active" stroke-width="3" filter="url(#softGlow)"><animate attributeName="r" values="15;18;15" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="735" cy="137" r="5" class="y"/><text x="735" y="98" class="fg" font-size="16" font-weight="700">SPECIALISING</text><text x="735" y="178" class="m" font-size="14">Web Security · Pentest</text></g>
<g><circle cx="1045" cy="137" r="16" class="green" fill-opacity=".9"/><circle cx="1045" cy="137" r="5" fill="#061009"/><text x="1045" y="98" class="fg" font-size="16" font-weight="700">DIRECTION</text><text x="1045" y="178" class="m" font-size="14">Penetration Test · Red Team</text></g>
</g>
<path d="M36 205H1164" class="line" stroke-opacity=".2"/>
<text x="36" y="238" class="m" font-size="13">PROGRESS  [████████████░░░░░░░░]  BUILD IN PROGRESS</text>
<circle cx="1137" cy="233" r="5" class="b"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="1150" y="238" class="m" font-size="11">ACTIVE</text>
</g>
</svg>