<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="Roadmap from web development and automation to Security+, current CCNA and eJPT study, and the goal of penetration testing and Red Teaming"><style>:root{--fg:#f1fff5;--muted:#83b792;--green:#43ff91;--line:#43ff91;--ochre:#d0a236;--pale:#f1dda0}@media(prefers-color-scheme:light){:root{--fg:#174d2a;--muted:#1a7f37;--green:#1a7f37;--line:#1a7f37;--ochre:#946b16;--pale:#ead792}}@media(prefers-reduced-motion:reduce){animate,animateTransform,animateMotion{display:none}}.fg{fill:var(--fg)}.m{fill:var(--muted)}.g{fill:var(--green)}.line{stroke:var(--line)}.gl{stroke:var(--green)}.y{fill:var(--ochre)}.yl{stroke:var(--ochre)}.active{fill:var(--pale);stroke:var(--ochre)}</style><defs><filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1.5" y="1.5" width="1197" height="307" rx="16" fill="none" class="line" stroke-opacity=".38" stroke-width="2"/><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="36" y="52" font-size="22"><tspan class="y">$</tspan><tspan dx="12" class="g">roadmap --active</tspan></text><g stroke-linecap="round"><path d="M115 151H1045" class="line" stroke-opacity=".18" stroke-width="12"/><path d="M115 151H735" class="gl" stroke-opacity=".82" stroke-width="5"/><path d="M115 151H735" class="gl" stroke-opacity=".42" stroke-width="2" stroke-dasharray="4 12"/></g><circle r="5" class="g" filter="url(#softGlow)"><animateMotion path="M115 151 H735" dur="5.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="5.6s" repeatCount="indefinite"/></circle><g text-anchor="middle"><g><circle cx="115" cy="151" r="16" class="g"/><circle cx="115" cy="151" r="5" fill="#061009"/><text x="115" y="106" class="fg" font-size="18" font