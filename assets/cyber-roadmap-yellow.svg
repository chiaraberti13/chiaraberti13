<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Terminal-style roadmap from web development and automation through Security+ to CCNA, eJPT, penetration testing and Red Teaming"><style>:root{--fg:#E6EDF3;--muted:#8B949E;--green:#22D3EE;--line:#22D3EE;--ochre:#F2C94C}@media(prefers-color-scheme:light){:root{--fg:#0B1117;--muted:#57606A;--green:#0E7490;--line:#0E7490;--ochre:#8A6D1F}}@media(prefers-reduced-motion:reduce){animate,animateMotion{display:none}}.fg{fill:var(--fg)}.m{fill:var(--muted)}.g{fill:var(--green)}.line{stroke:var(--line)}.gl{stroke:var(--green)}.y{fill:var(--ochre)}</style><rect x="1.5" y="1.5" width="1197" height="297" rx="16" fill="none" class="line" stroke-opacity=".38" stroke-width="2"/><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><text x="36" y="52" font-size="22"><tspan class="y">$</tspan><tspan dx="12" class="g">roadmap --status</tspan></text><path d="M145 154H1020" class="gl" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="3 9"/><circle r="3" class="g"><animateMotion path="M145 154 H725" dur="6.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;1;.2" keyTimes="0;.16;.84;1" dur="6.4s" repeatCount="indefinite"/></circle><g text-anchor="middle"><g><text x="145" y="101" class="g" font-size="15">[OK]</text><text x="145" y="130" class="fg" font-size="18" font-weight="700">FOUNDATIONS</text><circle cx="145" cy="154" r="5" fill="#0B1117" class="gl" stroke-width="2"/><text x="145" y="191" class="m" font-size="15">Web Dev · Automation</text></g><g><text x="435" y="101" class="g" font-size="15">[OK]</text><text x="435" y="130" class="fg" font-size="18" font-weight="700">CERTIFIED</text><circle cx="435" cy="154" r="5" fill="#0B1117" class="gl" stroke-width="2"/><text x="435" y="191" class="m" font-size="15">Linux Essentials · Security+</text></g><g><text x="725" y="101" class="y" font-size="15">[RUN]</text><text x="725" y="130" class="fg" font-size="18" font-weight="700">IN PROGRESS</text><circle cx="725" cy="154" r="5" class="y"><animate attributeName="opacity" values=".48;1;.48" dur="2.8s" repeatCount="indefinite"/></circle><text x="725" y="191" class="m" font-size="15">CCNA 200-301 · eJPT</text></g><g><text x="1020" y="101" class="m" font-size="15">[..]</text><text x="1020" y="130" class="fg" font-size="18" font-weight="700">GOAL</text><circle cx="1020" cy="154" r="5" fill="none" class="line" stroke-opacity=".38" stroke-width="2"/><text x="1020" y="191" class="m" font-size="15">Penetration Tester · Red Team</text></g></g><path d="M36 220H1164" class="line" stroke-opacity=".18"/><text x="36" y="261" font-size="16"><tspan class="y">&gt;</tspan><tspan dx="11" class="g">current_focus --ccna --ejpt --hands-on-labs</tspan><tspan class="y">_<animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></tspan></text></g></svg>