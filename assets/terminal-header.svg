<g transform="translate(978 95)" fill="none" stroke="#39ff88" stroke-opacity=".5"><rect width="150" height="150" rx="12"/><path d="M30 50l32 26-32 26M73 104h46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
