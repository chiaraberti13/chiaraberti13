<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Chiara Berti — Cybersecurity Professional</title>
<desc id="desc">Retro terminal inspired header</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07110d"/><stop offset="1" stop-color="#0b1712"/></linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".16"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#39ff88" stroke-opacity=".42" stroke-width="2"/>
<rect width="1200" height="360" rx="22" fill="url(#scan)"/>
<circle cx="42" cy="35" r="7" fill="#ff5f57"/><circle cx="66" cy="35" r="7" fill="#febc2e"/><circle cx="90" cy="35" r="7" fill="#28c840"/>
