<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Chiara Berti — Cybersecurity Professional</title>
<desc id="desc">Retro cyber terminal header</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030806"/><stop offset=".55" stop-color="#07140e"/><stop offset="1" stop-color="#020604"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#2dff87" stop-opacity=".15"/><stop offset="1" stop-color="#2dff87" stop-opacity="0"/></radialGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1.5h4" stroke="#000" stroke-opacity=".35"/></pattern>
  <pattern id="grid" width="50" height="34" patternUnits="userSpaceOnUse"><path d="M50 0H0V34" fill="none" stroke="#2dff87" stroke-opacity=".09"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<ellipse cx="860" cy="210" rx="420" ry="290" fill="url(#halo)"/>
<rect x="1.5" y="1.5" width="1197" height="417" rx="22.5" fill="none" stroke="#2dff87" stroke-opacity=".5" stroke-width="3"/>
<rect x="22" y="22" width="1156" height="376" rx="14" fill="none" stroke="#2dff87" stroke-opacity=".13"/>
<rect x="22" y="22" width="1156" height="52" rx="14" fill="#0b1711"/>
<path d="M22 74h1156" stroke="#2dff87" stroke-opacity=".2"/>
<circle cx="52" cy="48" r="7" fill="#ff5f57"/><circle cx="76" cy="48" r="7" fill="#febc2e"/><circle cx="100" cy="48" r="7" fill="#28c840"/>
<text x="132" y="55" fill="#719a80" font-family="'Courier New',monospace" font-size="17">secure-shell — chiara@cyberlab — 120×42</text>
<rect x="22" y="75" width="1156" height="323" fill="url(#grid)"/>
<g font-family="'Courier New',monospace">
