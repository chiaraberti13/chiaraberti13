<line x1="25" y1="62" x2="1175" y2="62" stroke="#39ff88" stroke-opacity=".18"/>
<g font-family="monospace">
  <text x="54" y="112" fill="#39ff88" font-size="24">$ whoami</text>
  <text x="54" y="174" fill="#e5fff0" font-size="48" font-weight="700" filter="url(#glow)">CHIARA BERTI</text>
  <text x="54" y="220" fill="#8fffb8" font-size="22">CYBERSECURITY • WEB SECURITY • LINUX</text>
