  <text x="60" y="272" fill="#9bd8ae" font-size="18">CompTIA Security+  /  Linux  /  Web Security &amp; Development</text>
  <text x="60" y="312" fill="#719a80" font-size="18">&gt; focus: application_security | pentesting | red_team</text>
  <text x="60" y="362" fill="#2dff87" font-size="19">$ status --current <tspan fill="#ecfff3">LEARNING_CONTINUOUSLY</tspan></text>
  <rect x="541" y="345" width="12" height="22" fill="#2dff87"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</g>
<g transform="translate(920 130)">
  <circle cx="102" cy="102" r="96" fill="#020604" stroke="#2dff87" stroke-opacity=".18"/>
  <circle cx="102" cy="102" r="78" fill="none" stroke="#2dff87" stroke-opacity=".35" stroke-dasharray="4 8"/>
