  <rect x="48" y="57" width="108" height="90" rx="9" fill="#07140e" stroke="#2dff87" stroke-opacity=".7"/>
  <path d="M70 85l25 19-25 19M104 124h28" fill="none" stroke="#2dff87" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text x="52" y="174" fill="#719a80" font-family="monospace" font-size="12">ACCESS: AUTHORIZED</text>
